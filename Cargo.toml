[package]
name = "yaml-dsl-terraform-generator"
version = "0.0.9"
edition = "2024"
license = "MIT"
description = "Generates Terraform from YAML DSLs defined by configuration."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-terraform-generator"
keywords = ["terraform", "yaml", "dsl", "tfgen", "codegen"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tfgen"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.20.0"
globset = "0.4.21"
hcl-edit = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
terminal_size = "0.4.4"
ureq = "3.5.0"
yaml-dsl-compiler = "=0.1.6"
yaml-dsl-spec = "=0.2.0"
yaml-dsl-spec-diagnostic-renderer = "=0.2.0"

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tiny_http = "0.12.0"
