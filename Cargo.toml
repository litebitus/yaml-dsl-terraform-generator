[package]
name = "yaml-dsl-terraform-generator"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Generates Terraform from YAML DSLs defined by configuration."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-terraform-generator"
keywords = ["terraform", "yaml", "dsl", "tfgen", "codegen"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tfgen"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.20.0"
globset = "0.4.21"
hcl-edit = "0.10.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
terminal_size = "0.4.4"
unicode-linebreak = "0.1.5"
unicode-width = "0.2.3"
ureq = "3.5.0"
yaml-dsl-spec = "0.0.1"

[dependencies.yaml-dsl-compiler]
git = "https://github.com/litebitus/yaml-dsl-compiler"
rev = "5c8a8a61fdc8ec143810db039d747d374ff35cbd"

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tiny_http = "0.12.0"
