version: 2

project_name: tfgen

before:
  hooks:
    - mkdir -p completions
    - sh -c 'cargo run --quiet -- completion bash > completions/tfgen.bash'
    - sh -c 'cargo run --quiet -- completion zsh > completions/tfgen.zsh'
    - sh -c 'cargo run --quiet -- completion fish > completions/tfgen.fish'

builds:
  - id: tfgen
    builder: rust
    binary: tfgen
    command: zigbuild
    flags:
      - --release
    env:
      - TFGEN_VERSION={{ .Version }}
    targets:
      - aarch64-apple-darwin
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - x86_64-unknown-linux-gnu

archives:
  - id: tfgen
    formats: [tar.gz]
    name_template: "tfgen_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

homebrew_casks:
  - name: tfgen
    repository:
      owner: litebitus
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/litebitus/yaml-dsl-terraform-generator"
    description: "Generates Terraform from YAML DSLs"
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/tfgen"]
        end
      end
    completions:
      bash: completions/tfgen.bash
      zsh: completions/tfgen.zsh
      fish: completions/tfgen.fish

release:
  github:
    owner: litebitus
    name: yaml-dsl-terraform-generator
  draft: false
  prerelease: auto
  extra_files:
    - glob: "{{ .Env.SCHEMA_ASSETS }}/*.schema.json"
